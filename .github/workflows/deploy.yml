name: CI/CD

# En cada push y pull request se verifica el código.
# Solo los push a main publican la imagen y despliegan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Prueba de humo: la app arranca, las migraciones se aplican sobre una
      # base vacía, los datos de ejemplo cargan y la API responde.
      - name: Probar migraciones y arranque
        env:
          ADMIN_PASSWORD: solo-para-ci
        run: |
          flask db upgrade
          flask seed
          python -c "
          from app import create_app
          cliente = create_app().test_client()
          assert cliente.get('/api/salud').status_code == 200
          assert len(cliente.get('/api/productos?tipo=alimento').json) > 0
          assert cliente.get('/api/usuarios').status_code == 401
          print('API correcta')
          "

  publicar:
    name: Publicar imagen
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos etiquetas: "latest" (la que despliega el stack) y el commit
      # (sirve para volver a una versión anterior con IMAGE_TAG)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en Portainer
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      # El webhook le pide a Portainer que descargue la imagen nueva y
      # actualice el stack. La URL se guarda como secreto del repositorio.
      - name: Llamar al webhook del stack
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Falta el secreto PORTAINER_WEBHOOK_URL; no se desplegó."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$WEBHOOK"
